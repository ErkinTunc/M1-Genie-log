name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

        # Gradle build already has Jacoco and Pitest plugins

      - name: Build and test
        run: bash ./gradlew build

      - name: Create Jacoco Test Report
        run: bash ./gradlew jacocoTestReport

      - name: Run PIT mutation testing
        run: bash ./gradlew pitest
